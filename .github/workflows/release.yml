name: Release

# Push a tag that matches package.json, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm build:skill

      - name: Check the committed skill bundle is up to date
        run: |
          if ! git diff --quiet -- skills/; then
            echo "::error::skills/ is out of date at this tag. Run pnpm build:skill, commit, and tag again."
            exit 1
          fi

      - run: pnpm package:release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Downloads

          - **mora-skill-$GITHUB_REF_NAME.zip**: the Agent Skill. Unzip it into your agent's skills directory, for example \`~/.claude/skills/\`. Needs Node 20 or later.
          - **mora-web-$GITHUB_REF_NAME.zip**: the web app as a static site. Serve the folder from the root of a domain with any static file server.
          - **SHA256SUMS.txt**: checksums for both archives.

          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
